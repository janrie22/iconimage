<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Diet &amp; Walk Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Diet Tracker">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f7c8a">
<link rel="apple-touch-icon" href="https://janrie22.github.io/iconimage/icon-512.png">
<link rel="icon" href="https://janrie22.github.io/iconimage/icon-512.png">
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;font:16px system-ui,sans-serif;background:#0f7c8a;color:#fff;text-align:center;padding:24px}
  img{width:96px;height:96px;border-radius:22px}
  a{display:inline-block;margin-top:18px;padding:12px 22px;border-radius:12px;background:#fff;color:#0b4f5c;font-weight:700;text-decoration:none}
  p{opacity:.85;max-width:300px;margin:10px auto 0}
</style>
</head>
<body>
<div>
  <img src="https://janrie22.github.io/iconimage/icon-512.png" alt="">
  <h2>Diet &amp; Walk Tracker</h2>
  <p id="msg">Tap Share, then Add to Home Screen. After that, open it from your home screen.</p>
  <a id="go" href="#">Open the tracker</a>
  <p style="font-size:12px;opacity:.6">launcher v2</p>
</div>
<script>
  // PUT YOUR WEB APP LINK HERE (the one that ends in /exec)
  var APP_URL = 'https://script.google.com/macros/s/AKfycbzsN2EhwCscdaxeC27Qq2vKqMoW5YX6A5scQgx7CLH2SDyZjviquBUMoIGR3a6k2uHK/exec';
  document.getElementById('go').href = APP_URL;
  // Opened from the home screen: go straight to the app.
  if (window.navigator.standalone === true) { location.replace(APP_URL); }
</script>
</body>
</html>
